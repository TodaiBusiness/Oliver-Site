<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050807" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f9f7" media="(prefers-color-scheme: light)" />
    <!-- Aplica o tema escolhido antes da primeira pintura (ver src/app/theme.js). -->
    <script src="/theme-init.js"></script>

    <title>TODAI | Estoque, caixa e vendas para a sua loja</title>
    <meta
      name="description"
      content="Sistema para Windows com estoque, comandas, caixa e resultado da loja num só lugar. R$ 110 por mês com 1 computador e R$ 20 por computador a mais. Da TODAI."
    />
    <meta name="author" content="TODAI" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      `__SITE_URL__` é trocado no build pelo valor de VITE_SITE_URL (ver
      vite.config.js). Não edite a URL aqui: ao ligar um domínio próprio, basta
      mudar a variável no Render e refazer o deploy.
    -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="TODAI" />
    <meta
      property="og:title"
      content="TODAI | Estoque, caixa e vendas para a sua loja"
    />
    <meta
      property="og:description"
      content="Sistema para Windows com estoque, comandas, caixa e resultado da loja num só lugar. R$ 110 por mês com 1 computador e R$ 20 por computador a mais. Da TODAI."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TODAI" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TODAI | Estoque, caixa e vendas para a sua loja"
    />
    <meta
      name="twitter:description"
      content="Sistema para Windows com estoque, comandas, caixa e resultado da loja num só lugar. R$ 110 por mês com 1 computador e R$ 20 por computador a mais. Da TODAI."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
