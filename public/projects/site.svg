    <rect x="310" y="406" width="72" height="8" rx="4"/>
    <rect x="500" y="406" width="94" height="8" rx="4"/>
  </g>

  <!-- celular -->
  <rect x="620" y="180" width="140" height="288" rx="26" fill="#0a0f0d" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="632" y="192" width="116" height="264" rx="18" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="668" y="200" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="648" y="230" width="26" height="10" rx="5" fill="#3b82f6" fill-opacity="0.85"/>
  <rect x="648" y="264" width="84" height="14" rx="6" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="648" y="286" width="60" height="14" rx="6" fill="#3b82f6" fill-opacity="0.6"/>
  <rect x="648" y="318" width="84" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="648" y="334" width="66" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="648" y="360" width="76" height="26" rx="13" fill="#3b82f6"/>
  <rect x="648" y="402" width="84" height="42" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
