  <!-- cards -->
  <g>
    <rect x="76" y="384" width="164" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="266" y="384" width="164" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="456" y="384" width="164" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
  <g fill="#3b82f6" fill-opacity="0.8">
