<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Site institucional responsivo">
  <defs>
    <linearGradient id="siteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="1" stop-color="#060908"/>
    </linearGradient>
    <radialGradient id="siteGlow" cx="0.2" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="560" fill="url(#siteBg)"/>
  <rect width="800" height="560" fill="url(#siteGlow)"/>

  <!-- navegador -->
  <rect x="48" y="60" width="600" height="400" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="48" y1="106" x2="648" y2="106" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="76" cy="83" r="5" fill="#3b82f6"/>
  <circle cx="94" cy="83" r="5" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="112" cy="83" r="5" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="140" y="75" width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>

  <!-- header do site -->
  <rect x="76" y="130" width="30" height="14" rx="7" fill="#3b82f6" fill-opacity="0.85"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="404" y="132" width="42" height="10" rx="5"/>
    <rect x="458" y="132" width="42" height="10" rx="5"/>
    <rect x="512" y="132" width="42" height="10" rx="5"/>
  </g>
  <rect x="566" y="126" width="54" height="22" rx="11" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>

  <!-- hero do site -->
  <rect x="76" y="188" width="300" height="22" rx="8" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="76" y="222" width="220" height="22" rx="8" fill="#3b82f6" fill-opacity="0.75"/>
  <rect x="76" y="266" width="270" height="10" rx="5" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="76" y="286" width="230" height="10" rx="5" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="76" y="322" width="104" height="32" rx="16" fill="#3b82f6"/>
  <rect x="192" y="322" width="104" height="32" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>

  <!-- bloco visual do site -->
  <rect x="416" y="188" width="204" height="166" rx="14" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.28"/>
  <g stroke="#8ec5ff" stroke-opacity="0.7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M446 316l38-42 30 26 34-52 32 40"/>
  </g>
  <g fill="#8ec5ff">
    <circle cx="446" cy="316" r="4"/>
    <circle cx="484" cy="274" r="4"/>
    <circle cx="514" cy="300" r="4"/>
    <circle cx="548" cy="248" r="4"/>
    <circle cx="580" cy="288" r="4"/>
